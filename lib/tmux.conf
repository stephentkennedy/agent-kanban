# The tmux server that hosts this tracker's agent sessions (kanban runs it on its own socket, so it never
# touches your own tmux). Each session is one window with one pane, viewed in the browser or with
# `kanban session attach`.

# No status bar or prefix key: the terminal belongs to the tool inside it (Claude Code itself uses Ctrl+B).
set -g status off
set -g prefix None
unbind-key C-b

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
# Keep a pane whose program has exited, so its last output stays readable.
set -g remain-on-exit on
# Several viewers may attach at once; the window follows the one that was active last.
set -g window-size latest
set -g aggressive-resize on
set -ga terminal-features ',xterm-256color:RGB'
set -g allow-passthrough on
set -g set-clipboard on
